name: NAUTILUS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEWS_API_KEY: ci_placeholder
          NOTIFY_SECRET: ci_placeholder
          NOTIFY_TO: ci@example.com
          RESEND_API_KEY: ci_placeholder
          NEXT_PUBLIC_SKIP_DATA_FETCH: true
