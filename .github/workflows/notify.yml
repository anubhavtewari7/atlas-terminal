name: Atlas Intelligence -- Email Digest

on:
  push:
    branches: [main]
    paths:
      - 'public/market-intelligence.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger email digest
        run: |
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.NOTIFY_SECRET }}" \
          "https://atlas-terminal-tau.vercel.app/api/notify")
          cat /tmp/response.json
          if [ "$STATUS" -ne 200 ]; then
            echo "Notify endpoint returned HTTP $STATUS"
            exit 1
          fi
          echo "Email sent successfully"
